<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="D6 統計"><meta name="theme-color" content="#101827"><title>D6 骰子統計</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,'Noto Sans TC',sans-serif;color:#edf2fc;background:#101827}*{box-sizing:border-box}body{margin:0;padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom)}main{max-width:560px;margin:auto;padding:20px 0 40px}h1{font-size:25px;margin:4px 0 5px}.sub{color:#a6b5ce;font-size:13px;margin:0 0 20px}.card{background:#1b2940;border:1px solid #33445f;border-radius:18px;padding:16px;margin:13px 0}.dice{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.die{touch-action:manipulation;background:#293d5b;border:1px solid #526d94;border-radius:15px;color:white;font-size:33px;font-weight:750;min-height:91px}.die:active{background:#46658d;transform:scale(.97)}.die small{display:block;font-size:12px;font-weight:400;color:#c5d4ea;margin-top:4px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{text-align:center;background:#243653;border-radius:12px;padding:12px 5px}.stat strong{display:block;font-size:23px}.stat span{font-size:12px;color:#b4c2d8}.barrow{display:grid;grid-template-columns:27px 1fr 70px;align-items:center;gap:9px;margin:12px 0;font-size:14px}.track{height:12px;background:#30415a;border-radius:99px;overflow:hidden}.fill{height:100%;background:#6ea7f4;border-radius:99px}.actions{display:flex;flex-wrap:wrap;gap:8px}button.action{background:#304361;color:white;border:1px solid #61718b;border-radius:11px;padding:12px;font-size:14px;flex:1;min-width:110px}button.danger{color:#ffb7b7}button:disabled{opacity:.4}.hint{color:#a9b9d1;font-size:12px;line-height:1.6}.history{max-height:150px;overflow:auto;font-size:13px;color:#cbd8ea}.history div{padding:6px;border-bottom:1px solid #33445f}label{font-size:13px;color:#b4c2d8}input{width:100%;padding:12px;background:#101b2d;border:1px solid #52617a;border-radius:9px;color:white;font-size:16px;margin-top:6px}h2{font-size:17px;margin:0 0 13px}#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#dce9ff;color:#162137;border-radius:12px;padding:10px 15px;display:none;font-size:14px;white-space:nowrap}</style></head><body><main><h1>🎲 D6 骰子統計</h1><p class="sub">每顆實體骰子擲完，點一下對應數字；自動儲存於此裝置。</p><section class="card"><h2>點選骰子點數</h2><div class="dice" id="dice"></div></section><section class="card"><div class="stats"><div class="stat"><strong id="total">0</strong><span>累計骰數</span></div><div class="stat"><strong id="round">0</strong><span>目前輪次</span></div><div class="stat"><strong id="last">—</strong><span>上次點數</span></div></div><div class="actions" style="margin-top:12px"><button class="action" id="undo">↶ 復原上一顆</button><button class="action" id="next">完成本輪</button></div><p class="hint">「完成本輪」會保存這輪紀錄並開始下一輪。統計包含目前輪次。</p></section><section class="card"><h2>累積點數分布</h2><div id="bars"></div><p class="hint">公平 D6 每個點數理論機率為 16.67%。樣本數少時，實際結果可能偏差很大。</p></section><section class="card"><h2>歷史輪次</h2><div class="history" id="history"></div></section><section class="card"><label for="session">統計名稱</label><input id="session" placeholder="例如：11/21 Kill Team" maxlength="80"><div class="actions" style="margin-top:13px"><button class="action" id="export">匯出 CSV</button><button class="action danger" id="reset">清除全部資料</button></div><p class="hint">資料只儲存在目前瀏覽器，清除 Safari 網站資料可能使紀錄消失。建議定期匯出 CSV 備份。</p></section></main><div id="toast"></div><script>
(()=>{'use strict';const KEY='d6-tracker-v1';let data;try{data=JSON.parse(localStorage.getItem(KEY))}catch(e){}if(!data||!Array.isArray(data.rolls))data={rolls:[],session:''};data.rolls=data.rolls.filter(x=>Number.isInteger(x.n)&&x.n>=1&&x.n<=6&&Number.isInteger(x.round)&&x.round>=1);const $=id=>document.getElementById(id);const save=()=>localStorage.setItem(KEY,JSON.stringify(data));const current=()=>data.rolls.length?Math.max(1,...data.rolls.map(x=>x.round))+((data.closedRound||0)>=Math.max(...data.rolls.map(x=>x.round))?1:0):Math.max(1,(data.closedRound||0)+1);function notice(s){$('toast').textContent=s;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',1800)}function render(){const counts=Array(6).fill(0);data.rolls.forEach(x=>counts[x.n-1]++);const total=data.rolls.length;$('total').textContent=total;$('round').textContent=current();$('last').textContent=total?data.rolls[total-1].n:'—';$('dice').innerHTML='';counts.forEach((c,i)=>{const b=document.createElement('button');b.className='die';b.innerHTML=`${i+1}<small>${c} 次</small>`;b.onclick=()=>{data.rolls.push({n:i+1,round:current(),time:new Date().toISOString()});save();render()};$('dice').appendChild(b)});$('bars').innerHTML=counts.map((c,i)=>`<div class="barrow"><b>${i+1}</b><div class="track"><div class="fill" style="width:${total?c/total*100:0}%"></div></div><span>${c} · ${total?(c/total*100).toFixed(1):'0.0'}%</span></div>`).join('');$('undo').disabled=!total;const groups={};data.rolls.forEach(x=>(groups[x.round]??=[]).push(x.n));const nums=Object.keys(groups).map(Number).sort((a,b)=>b-a);$('history').innerHTML=nums.length?nums.map(n=>`<div>第 ${n} 輪（${groups[n].length} 顆）：${groups[n].join('、')}</div>`).join(''):'尚無紀錄';$('session').value=data.session||''} $('undo').onclick=()=>{if(!data.rolls.length)return;const x=data.rolls.pop();if(data.closedRound>=x.round)data.closedRound=x.round-1;save();render()};$('next').onclick=()=>{const r=current();if(!data.rolls.some(x=>x.round===r)){notice('本輪尚未輸入骰子');return}data.closedRound=r;save();render();notice(`第 ${r} 輪已完成`)};$('session').onchange=e=>{data.session=e.target.value;save()};$('reset').onclick=()=>{if(confirm('確定永久清除所有骰子紀錄？建議先匯出 CSV。')){data={rolls:[],session:''};save();render()}};$('export').onclick=()=>{const lines=['統計名稱,輪次,點數,時間',...data.rolls.map(x=>[JSON.stringify(data.session||''),x.round,x.n,x.time].join(','))];const blob=new Blob(['\ufeff'+lines.join('\r\n')],{type:'text/csv;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`D6骰子統計_${new Date().toISOString().slice(0,10)}.csv`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)};render()})();
</script></body></html>
