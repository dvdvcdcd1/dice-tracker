<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="D6 統計"><meta name="theme-color" content="#101827"><title>D6 骰子統計</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Noto Sans TC',sans-serif;color:#edf2fc;background:#101827}*{box-sizing:border-box}body{margin:0;padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom)}main{max-width:560px;margin:auto;padding:20px 0 40px}h1{font-size:25px;margin:4px 0 5px}.sub{color:#a6b5ce;font-size:13px;margin:0 0 20px}.card{background:#1b2940;border:1px solid #33445f;border-radius:18px;padding:16px;margin:13px 0}h2{font-size:17px;margin:0 0 13px}.switch-title{font-size:13px;color:#b4c2d8;margin:12px 0 7px}.switch{display:grid;grid-template-columns:1fr 1fr;gap:9px}.switch button{min-height:51px;border:1px solid #526d94;border-radius:12px;background:#293d5b;color:#c9d6eb;font-size:17px;font-weight:650;touch-action:manipulation}.switch button.active{background:#3674c2;border-color:#8ebeff;color:white;box-shadow:inset 0 0 0 1px #8ebeff}.dice{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.die{touch-action:manipulation;background:#293d5b;border:1px solid #526d94;border-radius:15px;color:white;font-size:33px;font-weight:750;min-height:91px}.die:active{background:#46658d;transform:scale(.97)}.die small{display:block;font-size:12px;font-weight:400;color:#c5d4ea;margin-top:4px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{text-align:center;background:#243653;border-radius:12px;padding:12px 5px}.stat strong{display:block;font-size:23px}.stat span{font-size:12px;color:#b4c2d8}.barrow{display:grid;grid-template-columns:27px 1fr 84px;align-items:center;gap:9px;margin:12px 0;font-size:14px}.track{height:12px;background:#30415a;border-radius:99px;overflow:hidden}.fill{height:100%;background:#6ea7f4;border-radius:99px}.actions{display:flex;flex-wrap:wrap;gap:8px}button.action{background:#304361;color:white;border:1px solid #61718b;border-radius:11px;padding:12px;font-size:14px;flex:1;min-width:110px}button.danger{color:#ffb7b7}button:disabled{opacity:.4}.hint{color:#a9b9d1;font-size:12px;line-height:1.6}.history{max-height:250px;overflow:auto;font-size:13px;color:#cbd8ea}.history div{padding:8px 0;border-bottom:1px solid #33445f;line-height:1.6}label{font-size:13px;color:#b4c2d8}input{width:100%;padding:12px;background:#101b2d;border:1px solid #52617a;border-radius:9px;color:white;font-size:16px;margin-top:6px}#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#dce9ff;color:#162137;border-radius:12px;padding:10px 15px;display:none;font-size:14px;white-space:nowrap}.pill{display:inline-block;border-radius:7px;padding:2px 7px;background:#304b70;color:#e2eeff;margin-right:5px}.filter{width:100%;padding:10px;border:1px solid #52617a;border-radius:9px;background:#101b2d;color:white;font-size:15px;margin-bottom:6px}
</style></head><body><main><h1>🎲 D6 骰子統計</h1><p class="sub">選擇我方／對手、攻擊／防禦，再點選實體骰子的點數。</p>
<section class="card"><h2>本次擲骰分類</h2><div class="switch-title">擲骰者</div><div class="switch" id="players"><button data-value="self">我方</button><button data-value="opponent">對手</button></div><div class="switch-title">擲骰用途</div><div class="switch" id="types"><button data-value="attack">⚔️ 攻擊</button><button data-value="defense">🛡️ 防禦</button></div><p class="hint">每次點數會記錄當下選擇的分類，切換不會改動先前的紀錄。</p></section>
<section class="card"><h2>點選骰子點數</h2><div class="dice" id="dice"></div></section>
<section class="card"><div class="stats"><div class="stat"><strong id="total">0</strong><span>全部累計骰數</span></div><div class="stat"><strong id="round">1</strong><span>目前輪次</span></div><div class="stat"><strong id="last">—</strong><span>上次點數</span></div></div><div class="actions" style="margin-top:12px"><button class="action" id="undo">↶ 復原上一顆</button><button class="action" id="next">完成本輪</button></div><p class="hint">完成本輪會開始下一輪；所有分類的紀錄都會保留。</p></section>
<section class="card"><h2>點數分布與機率</h2><label for="filter">統計範圍</label><select id="filter" class="filter"><option value="all">全部骰子</option><option value="self-attack">我方 · 攻擊</option><option value="self-defense">我方 · 防禦</option><option value="opponent-attack">對手 · 攻擊</option><option value="opponent-defense">對手 · 防禦</option><option value="self">我方 · 全部</option><option value="opponent">對手 · 全部</option><option value="attack">全部 · 攻擊</option><option value="defense">全部 · 防禦</option></select><p class="hint" id="scopeTotal"></p><div id="bars"></div><p class="hint">公平 D6 每個點數理論機率為 16.67%。樣本數少時，實際結果可能偏差很大。</p></section>
<section class="card"><h2>歷史輪次</h2><div class="history" id="history"></div></section>
<section class="card"><label for="session">統計名稱</label><input id="session" placeholder="例如：Kill Team 對戰" maxlength="80"><div class="actions" style="margin-top:13px"><button class="action" id="export">匯出 CSV</button><button class="action danger" id="reset">清除全部資料</button></div><p class="hint">資料儲存在目前瀏覽器。清除 Safari 網站資料可能使紀錄消失，請定期匯出 CSV。</p></section></main><div id="toast" role="status"></div><script>
(()=>{'use strict';const KEY='d6-tracker-v1';let data;try{data=JSON.parse(localStorage.getItem(KEY))}catch(e){}if(!data||!Array.isArray(data.rolls))data={rolls:[],session:''};data.rolls=data.rolls.filter(x=>Number.isInteger(x.n)&&x.n>=1&&x.n<=6&&Number.isInteger(x.round)&&x.round>=1).map(x=>({...x,player:x.player==='opponent'?'opponent':'self',type:x.type==='defense'?'defense':'attack'}));data.player=data.player==='opponent'?'opponent':'self';data.type=data.type==='defense'?'defense':'attack';data.closedRound=Number.isInteger(data.closedRound)&&data.closedRound>=0?data.closedRound:0;data.filter=data.filter||'all';const $=id=>document.getElementById(id);const save=()=>localStorage.setItem(KEY,JSON.stringify(data));const current=()=>Math.max(data.closedRound+1,...data.rolls.map(x=>x.round),1);const playerName=x=>x==='opponent'?'對手':'我方';const typeName=x=>x==='defense'?'防禦':'攻擊';let toastTimer;function notice(s){$('toast').textContent=s;$('toast').style.display='block';clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').style.display='none',1800)}function selected(x){const f=data.filter;return f==='all'||f===x.player+'-'+x.type||f===x.player||f===x.type}function render(){const total=data.rolls.length;const subset=data.rolls.filter(selected);const counts=Array(6).fill(0),activeCounts=Array(6).fill(0);data.rolls.forEach(x=>counts[x.n-1]++);subset.forEach(x=>activeCounts[x.n-1]++);$('total').textContent=total;$('round').textContent=current();$('last').textContent=total?data.rolls[total-1].n:'—';document.querySelectorAll('#players button').forEach(b=>{b.classList.toggle('active',b.dataset.value===data.player);b.setAttribute('aria-pressed',String(b.dataset.value===data.player))});document.querySelectorAll('#types button').forEach(b=>{b.classList.toggle('active',b.dataset.value===data.type);b.setAttribute('aria-pressed',String(b.dataset.value===data.type))});$('dice').innerHTML='';counts.forEach((c,i)=>{const b=document.createElement('button');b.className='die';b.innerHTML=`${i+1}<small>${c} 次（全部）</small>`;b.onclick=()=>{data.rolls.push({n:i+1,round:current(),player:data.player,type:data.type,time:new Date().toISOString()});save();render()};$('dice').appendChild(b)});$('filter').value=data.filter;$('scopeTotal').textContent=`目前篩選：${subset.length} 顆／全部 ${total} 顆`;$('bars').innerHTML=activeCounts.map((c,i)=>`<div class="barrow"><b>${i+1}</b><div class="track"><div class="fill" style="width:${subset.length?c/subset.length*100:0}%"></div></div><span>${c} · ${subset.length?(c/subset.length*100).toFixed(1):'0.0'}%</span></div>`).join('');$('undo').disabled=!total;const groups={};data.rolls.forEach(x=>(groups[x.round]??=[]).push(x));const nums=Object.keys(groups).map(Number).sort((a,b)=>b-a);$('history').innerHTML=nums.length?nums.map(n=>`<div><strong>第 ${n} 輪（${groups[n].length} 顆）</strong><div>${['self','opponent'].flatMap(p=>['attack','defense'].map(t=>{const a=groups[n].filter(x=>x.player===p&&x.type===t);return a.length?`<span class="pill">${playerName(p)} · ${typeName(t)}</span>${a.map(x=>x.n).join('、')}<br>`:''})).join('')}</div></div>`).join(''):'尚無紀錄';if(document.activeElement!==$('session'))$('session').value=data.session||''}document.querySelectorAll('#players button').forEach(b=>b.onclick=()=>{data.player=b.dataset.value;save();render()});document.querySelectorAll('#types button').forEach(b=>b.onclick=()=>{data.type=b.dataset.value;save();render()});$('filter').onchange=e=>{data.filter=e.target.value;save();render()};$('undo').onclick=()=>{if(!data.rolls.length)return;data.rolls.pop();save();render();notice('已復原上一顆')};$('next').onclick=()=>{const r=current();if(!data.rolls.some(x=>x.round===r)){notice('本輪尚未輸入骰子');return}data.closedRound=r;save();render();notice(`第 ${r} 輪已完成`)};$('session').oninput=e=>{data.session=e.target.value;save()};$('reset').onclick=()=>{if(confirm('確定永久清除所有骰子紀錄？建議先匯出 CSV。')){data={rolls:[],session:'',player:data.player,type:data.type,filter:'all',closedRound:0};save();render()}};function csvCell(x){return '"'+String(x??'').replace(/"/g,'""')+'"'}$('export').onclick=()=>{const lines=['統計名稱,輪次,擲骰者,用途,點數,時間',...data.rolls.map(x=>[data.session||'',x.round,playerName(x.player),typeName(x.type),x.n,x.time||''].map(csvCell).join(','))];const blob=new Blob(['\ufeff'+lines.join('\r\n')],{type:'text/csv;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`D6骰子統計_${new Date().toISOString().slice(0,10)}.csv`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000)};save();render()})();
</script></body></html>
